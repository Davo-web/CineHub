<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6D28D9;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#6D28D9" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Фон: скруглённый квадрат с градиентом -->
  <rect x="5" y="5" width="90" height="90" rx="22" ry="22" fill="url(#grad)" filter="url(#shadow)"/>

  <!-- Иконка Play (треугольник) -->
  <polygon points="38,28 38,72 72,50" fill="white"/>

  <!-- Блик для объёма -->
  <path d="M 27 5 Q 50 5 73 5 A 22 22 0 0 1 95 27 Q 95 50 95 50" 
        fill="none" stroke="white" stroke-width="2" opacity="0.15" stroke-linecap="round"/>
</svg>